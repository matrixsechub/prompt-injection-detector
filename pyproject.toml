[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-detector"
version = "0.1.0"
description = "Experimental rule-based prompt-injection detection prototype."
authors = [
    { name = "Guadalupe Gallegos" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/matrixsechub/prompt-injection-detector"
Repository = "https://github.com/matrixsechub/prompt-injection-detector"

[project.scripts]
pid = "pid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
