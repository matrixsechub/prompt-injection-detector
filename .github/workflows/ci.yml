name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . || pip install -r requirements.txt || echo "No installable package"
      - run: pip install pytest
      - run: pytest --tb=short || echo "No tests found"
