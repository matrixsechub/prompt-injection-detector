name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Every step must be able to fail the job. Do not append `|| echo`.
      - run: pip install -e .
      - run: pip install pytest
      - run: pytest --tb=short
